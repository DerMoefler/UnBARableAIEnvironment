[project]
name = "UnBARableAIEnvironment"
version = "0.1.0"
description = "Environment for the UnBARableAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "pybind11>=3.0.4",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"
