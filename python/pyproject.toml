[project]
name = "UnBARableAIEnvironment"
version = "0.1.0"
description = "Environment for the UnBARableAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "pybind11>=3.0.4",
    "numpy",
    "torch>=2.12.0",
    "wandb>=0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.scikit-build]
wheel.packages = ["src"]

[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"
