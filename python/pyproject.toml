[project]
name = "UnBARableAIEnvironment"
version = "0.1.0"
description = "Environment for the UnBARableAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.85.0",
    "grpcio-tools>=1.83.1",
    "pybind11>=3.0.4",
    "numpy",
    "pytest>=8.0",
    "torch>=2.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that involve multiple components (i.e. their integration, hence the name) thus being slower"
]

[tool.scikit-build]
wheel.packages = ["src"]

[tool.scikit-build.cmake.define]
CMAKE_TOOLCHAIN_FILE = "../cpp/build/Release/generators/conan_toolchain.cmake"

[build-system]
requires = ["scikit-build-core", "pybind11", "grpcio-tools"]
build-backend = "scikit_build_core.build"
